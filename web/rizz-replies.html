                    "on-secondary-fixed-variant": "#5516be", "secondary-fixed": "#e9ddff",
                    "primary-fixed": "#c3f400", "on-secondary": "#3c0091", "inverse-surface": "#d3e4fe",
                    "on-tertiary": "#283044", "error-container": "#93000a", "outline-variant": "#444933",
                    "on-error-container": "#ffdad6", "surface-container": "#102034",
                    "surface-container-high": "#1b2b3f", "on-primary-fixed-variant": "#3c4d00",
                    "surface": "#031427", "on-surface": "#d3e4fe", "on-background": "#d3e4fe",
                    "surface-container-lowest": "#000f21", "surface-bright": "#2a3a4f",

                    "secondary-container": "#571bc1", "on-primary": "#283500",
                    "on-tertiary-fixed-variant": "#3f465c", "secondary": "#d0bcff", "outline": "#8e9379",
                    "on-surface-variant": "#c4c9ac", "secondary-fixed-dim": "#d0bcff",
                    "primary": "#ffffff", "tertiary-fixed-dim": "#bec6e0"
                },
                "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                "spacing": { "xs": "8px", "gutter": "16px", "lg": "24px", "base": "4px", "xl": "32px", "margin": "20px", "sm": "12px", "md": "16px" },
                "fontFamily": {

                    "label-md": ["JetBrains Mono"], "body-md": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"], "label-sm": ["JetBrains Mono"],
                    "headline-md": ["Hanken Grotesk"], "display-lg": ["Hanken Grotesk"]
                },
                "fontSize": {

                    "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],

                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}]
                }
            }}
        }
    </script>
<style>
        .cyber-pulse { animation: pulse-glow 2s cubic-bezier(0.4,0,0.6,1) infinite; }
        @keyframes pulse-glow { 0%,100% { opacity: 1; box-shadow: 0 0 10px rgba(195,244,0,0.3); } 50% { opacity: 0.8; box-shadow: 0 0 20px rgba(195,244,0,0.6); } }
        .glass-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-top: 1px solid rgba(255,255,255,0.15); border-bottom: 1px solid rgba(255,255,255,0.05); border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1); }
        .btn-motion { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .btn-motion:hover { transform: translateY(-2px); }
        .btn-motion:active { transform: scale(0.95); }
        .btn-volt-motion { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 0 20px rgba(195,244,0,0.3), inset 0 0 10px rgba(255,255,255,0.2); }
        .btn-volt-motion:hover { transform: translateY(-3px); box-shadow: 0 0 40px rgba(195,244,0,0.6), inset 0 0 15px rgba(255,255,255,0.3); }
        .btn-volt-motion:active { transform: scale(0.95); box-shadow: 0 0 50px rgba(195,244,0,0.8), inset 0 0 20px rgba(255,255,255,0.4); }
        .icon-btn-motion { transition: all 0.2s ease-in-out; }
        .icon-btn-motion:hover { transform: scale(1.1) rotate(5deg); }
        .icon-btn-motion:active { transform: scale(0.9); }
        @keyframes slide-up-fade { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slide-up-fade 0.7s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
        .delay-100 { animation-delay: 100ms; } .delay-200 { animation-delay: 200ms; } .delay-300 { animation-delay: 300ms; } .delay-400 { animation-delay: 400ms; }
    </style>
<style>body { min-height: max(884px, 100dvh); }</style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md pt-16 pb-24 md:pb-0 overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-[0_0_20px_rgba(171,214,0,0.05)]">
<div class="flex items-center justify-between px-margin h-16 w-full">
<a class="icon-btn-motion text-on-surface-variant p-2 -ml-2" href="rizz.html"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span></a>
<h1 class="font-display-lg text-headline-lg-mobile tracking-tighter text-primary-fixed">RIZZ Ler</h1>
<a class="icon-btn-motion text-on-surface-variant p-2 -mr-2" href="rizz-settings.html"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span></a>
</div>
</header>
<main class="px-margin md:max-w-2xl md:mx-auto pt-lg space-y-lg">
<!-- Analyzed Image -->
<section class="relative rounded-xl overflow-hidden shadow-[0_0_15px_rgba(195,244,0,0.15)] border border-white/10">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-lowest z-10 pointer-events-none"></div>
<img alt="Analyzed Chat" class="w-full h-48 object-cover object-top opacity-80" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAl3WQGP8B0CLOT6WUc33KhJtOJ-KtFYqVo5yXVTZVZoBvUZ3HLXuaal2XukTN-NltVAACRnKTEBE7jfBzUrYIYbIaW9bbJBI1mdXn4EVoxlQf_pbRzqyJnudTA6WR7F8mH116trGE9HS6cEDqC8vKtwN_mdd8f_wHkKNN1AXfssBgduLkv4njcXR3Cvee6hzhqX5e_iirqrNSc0dTmN1sKcuajDZn_UY-1gsghrHErB9oJ5bVkkYXqbsWN6srJM-8DVEG-Vy0DlY">
<div class="absolute bottom-sm left-sm z-20 flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-primary-fixed cyber-pulse"></div>
<span class="font-label-sm text-label-sm text-primary-fixed uppercase tracking-widest">Analysis Complete</span>
</div>
</section>
<!-- Tone Indicator -->
<section class="flex flex-col gap-xs animate-slide-up delay-100">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Detected Tone</h2>
<div class="glass-card rounded-lg p-sm flex items-center justify-between">
<span class="font-headline-md text-headline-md-mobile text-primary">Playful &amp; Interested</span>
<span class="material-symbols-outlined text-primary-fixed cyber-pulse" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</section>
<!-- Reply Suggestions -->
<section class="space-y-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Smart Replies</h2>
<div id="replyList" class="space-y-sm"></div>
</section>
<!-- Bottom Actions -->
<section class="flex flex-col gap-sm pt-sm pb-10">
<button class="btn-motion w-full py-md rounded-lg glass-card text-on-surface font-label-md text-label-md uppercase tracking-wider flex items-center justify-center gap-xs" id="improveBtn">
<span class="material-symbols-outlined text-lg">auto_awesome</span> Make this reply better
</button>
<button class="btn-volt-motion w-full py-md rounded-lg bg-primary-fixed text-on-primary-fixed font-headline-md text-headline-md-mobile" id="impressBtn">Impress Her</button>
</section>
</main>
<script>
    const DEMO_MESSAGES = [
        { sender: 'them', body: 'hey! how are you? 😊' },
        { sender: 'me', body: 'doing great, just finished a workout' },
        { sender: 'them', body: 'oh nice, you seem pretty fit then 😏' }
    ];
    function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function fetchReplies() {
        const replyList = document.getElementById('replyList');
        replyList.innerHTML = '<div style="padding:24px;text-align:center;color:#8e9379;font-family:JetBrains Mono;font-size:12px;">⚡ Generating fresh replies via AI...</div>';
        try {
            const res = await fetch('/api/rizz/generate', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: DEMO_MESSAGES, tone: 'Flirty', delivery: 'Casual & Direct', intensity: 6, intent: 'continue', provider: 'auto', language: '' })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Failed');
            const candidates = data.data.candidates || [];
            if (!candidates.length) throw new Error('No candidates');
            renderCards(candidates);
        } catch (err) {
            console.error(err);
            renderFallback();
        }
    }

    function renderCards(candidates) {
        const replyList = document.getElementById('replyList');
        const delays = ['delay-200','delay-300','delay-400'];
        const tagColors = ['text-on-secondary-container','text-error','text-secondary'];
        replyList.innerHTML = candidates.slice(0,3).map((c,i) => `
            <div class="glass-card rounded-xl p-md flex flex-col gap-sm group active:scale-[0.98] transition-all duration-150 animate-slide-up ${delays[i]||'delay-400'} ${i===0?'border-primary-fixed/40 shadow-[0_0_20px_rgba(195,244,0,0.15)] relative':''}">
                ${i===0?'<div class="absolute inset-0 rounded-xl bg-primary-fixed/5 pointer-events-none"></div>':''}
                <div class="flex items-center justify-between relative z-10">
                    <span class="font-label-sm text-label-sm bg-surface-container-high ${tagColors[i]||'text-on-surface'} px-2 py-1 rounded-full uppercase tracking-wider border border-white/5">${c.style||'Option'}</span>
                    <button class="icon-btn-motion text-on-surface-variant group-hover:text-primary-fixed" data-copy="${encodeURIComponent(c.body)}"><span class="material-symbols-outlined text-lg">content_copy</span></button>
                </div>
                <p class="font-body-lg text-body-lg text-on-surface relative z-10">${escapeHtml(c.body)}</p>
            </div>`).join('');
    }

    function renderFallback() {
        renderCards([
            { style: 'Flirty', body: 'Oh, you think you can handle me? Challenge accepted. 😈' },
            { style: 'Spicy', body: 'Less talking, more showing. When are we making this happen?' },
            { style: 'Funny', body: "I'd reply with something witty, but you've already left me speechless." }
        ]);
    }

    document.addEventListener('click', async (e) => {
        const copyBtn = e.target.closest('[data-copy]');
        if (copyBtn) {
            const text = decodeURIComponent(copyBtn.dataset.copy);
            try { await navigator.clipboard.writeText(text); const icon = copyBtn.querySelector('.material-symbols-outlined'); const orig = icon.textContent; icon.textContent = 'check'; setTimeout(()=>icon.textContent=orig,1200); } catch {}
            return;
        }
        if (e.target.closest('#improveBtn') || e.target.closest('#impressBtn')) { fetchReplies(); return; }
    });
    fetchReplies();
</script>
</body></html>
