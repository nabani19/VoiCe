services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=voice
      - POSTGRES_PASSWORD=voice
      - POSTGRES_DB=voice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  api:
    image: node:22-slim
    working_dir: /app/web/data-api
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://voice:voice@db:5432/voice
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node server.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=1
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_SANDBOX_HOST_DOMAIN}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-ec", "apt-get update -qq && apt-get install -y -qq ca-certificates > /dev/null 2>&1 && cd /app/web && npm install --no-audit --no-fund && exec npx wrangler pages dev . --port 3000 --ip 0.0.0.0 --compatibility-date=2024-01-01"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
